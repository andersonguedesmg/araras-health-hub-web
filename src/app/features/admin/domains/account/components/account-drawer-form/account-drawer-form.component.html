<app-drawer
  [(visible)]="visible"
  [header]="headerText()"
  [position]="'right'"
  [size]="'xl'"
>
  @if (isGlobalLoading()) {
    <div
      class="w-full h-1 bg-zinc-100 dark:bg-zinc-800 overflow-hidden relative mb-4 rounded-full"
    >
      <div
        class="absolute h-full w-1/3 bg-primary animate-pulse rounded-full"
      ></div>
    </div>
  }

  <form
    [formGroup]="accountForm"
    body
    class="space-y-6"
    [class.opacity-60]="isGlobalLoading()"
  >
    <div
      class="bg-white dark:bg-zinc-900/90 p-5 rounded-xl border border-zinc-200 dark:border-zinc-800 shadow-sm space-y-4"
    >
      <h3
        class="text-xs font-bold text-zinc-400 tracking-wider uppercase flex items-center gap-2"
      >
        <i class="pi pi-user"></i> Informações
      </h3>
      <hr class="border-zinc-100 dark:border-zinc-800" />

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        @if (formMode() !== FormMode.Create) {
          <div>
            <label class="block text-xs font-semibold text-zinc-500 mb-1"
              >ID</label
            >
            <input
              pInputText
              type="text"
              formControlName="id"
              class="w-full bg-zinc-100/70 dark:bg-zinc-800/60 border border-zinc-200 dark:border-zinc-700 text-zinc-500 dark:text-zinc-400 rounded-lg p-2 font-medium shadow-inner focus:outline-none"
            />
          </div>

          <div>
            <label class="block text-xs font-semibold text-zinc-500 mb-1"
              >Status</label
            >
            <input
              pInputText
              type="text"
              [value]="statusLabel()"
              disabled
              class="w-full bg-zinc-100/70 dark:bg-zinc-800/60 border border-zinc-200 dark:border-zinc-700 text-zinc-500 dark:text-zinc-400 rounded-lg p-2 font-medium shadow-inner focus:outline-none"
            />
          </div>
        }

        <div
          class="w-full"
          [class.sm:col-span-1]="formMode() === FormMode.Create"
          [class.sm:col-span-2]="formMode() !== FormMode.Create"
        >
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            Nome
            @if (formMode() !== FormMode.Detail) {
              <span class="text-red-500">*</span>
            }
          </label>
          <input
            pInputText
            type="text"
            formControlName="userName"
            maxlength="100"
            class="w-full border rounded-lg p-2 transition-colors duration-200 bg-zinc-50/50 dark:bg-zinc-800/30 text-zinc-800 dark:text-zinc-100 focus:border-primary focus:outline-none disabled:bg-zinc-100/70 disabled:dark:bg-zinc-800/60 disabled:text-zinc-500 disabled:dark:text-zinc-400 disabled:shadow-inner"
            [class.border-red-500]="
              formSubmitted() && accountForm.get('userName')?.invalid
            "
            [class.focus:border-red-500]="
              formSubmitted() && accountForm.get('userName')?.invalid
            "
            [class.focus:ring-1]="
              formSubmitted() && accountForm.get('userName')?.invalid
            "
            [class.focus:ring-red-500]="
              formSubmitted() && accountForm.get('userName')?.invalid
            "
            [class.border-zinc-300]="
              !(formSubmitted() && accountForm.get('userName')?.invalid)
            "
            [class.dark:border-zinc-700]="
              !(formSubmitted() && accountForm.get('userName')?.invalid)
            "
          />
        </div>

        @if (formMode() === FormMode.Create) {
          <div>
            <label
              class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
            >
              Senha
              <span class="text-red-500">*</span>
            </label>
            <input
              pInputText
              type="password"
              formControlName="password"
              class="w-full border rounded-lg p-2 transition-colors duration-200 bg-zinc-50/50 dark:bg-zinc-800/30 text-zinc-800 dark:text-zinc-100 focus:border-primary focus:outline-none disabled:bg-zinc-100/70 disabled:dark:bg-zinc-800/60 disabled:text-zinc-500 disabled:dark:text-zinc-400 disabled:shadow-inner"
              [class.border-red-500]="
                formSubmitted() && accountForm.get('password')?.invalid
              "
              [class.focus:border-red-500]="
                formSubmitted() && accountForm.get('password')?.invalid
              "
              [class.focus:ring-1]="
                formSubmitted() && accountForm.get('password')?.invalid
              "
              [class.focus:ring-red-500]="
                formSubmitted() && accountForm.get('password')?.invalid
              "
              [class.border-zinc-300]="
                !(formSubmitted() && accountForm.get('password')?.invalid)
              "
              [class.dark:border-zinc-700]="
                !(formSubmitted() && accountForm.get('password')?.invalid)
              "
            />
          </div>
        }

        <div class="sm:col-span-2">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            Unidade
            @if (formMode() !== FormMode.Detail) {
              <span class="text-red-500">*</span>
            }
          </label>
          <p-select
            [options]="facilityOptions()"
            formControlName="facilityId"
            optionLabel="label"
            optionValue="value"
            placeholder="Selecione uma unidade"
            class="w-full border rounded-lg transition-colors duration-200 focus-within:border-primary"
            [class.border-red-500]="
              formSubmitted() && accountForm.get('facilityId')?.invalid
            "
            [class.border-zinc-300]="
              !(formSubmitted() && accountForm.get('facilityId')?.invalid)
            "
            [class.dark:border-zinc-700]="
              !(formSubmitted() && accountForm.get('facilityId')?.invalid)
            "
            [showClear]="formMode() !== FormMode.Detail"
            [virtualScroll]="true"
            [virtualScrollItemSize]="38"
            [lazy]="true"
            (onLazyLoad)="onFacilityDropdownLazyLoad($event)"
            [filter]="true"
            (onFilter)="onFacilityDropdownFilter($event)"
            [loading]="isFacilitiesLoading()"
          >
            <ng-template pTemplate="empty">
              <span class="p-4 text-xs text-zinc-500 block"
                >Nenhuma unidade encontrada</span
              >
            </ng-template>
          </p-select>
        </div>

        <div>
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            Função / Perfil
            @if (formMode() !== FormMode.Detail) {
              <span class="text-red-500">*</span>
            }
          </label>
          <p-select
            [options]="rolesOptions"
            formControlName="role"
            optionLabel="label"
            optionValue="value"
            class="w-full border rounded-lg transition-colors duration-200"
            [class.border-red-500]="
              formSubmitted() && accountForm.get('role')?.invalid
            "
            [class.border-zinc-300]="
              !(formSubmitted() && accountForm.get('role')?.invalid)
            "
            [class.dark:border-zinc-700]="
              !(formSubmitted() && accountForm.get('role')?.invalid)
            "
            placeholder="Selecione o perfil"
          ></p-select>
        </div>

        <div>
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            Escopo de Acesso
            @if (formMode() !== FormMode.Detail) {
              <span class="text-red-500">*</span>
            }
          </label>
          <p-select
            [options]="scopeOptions"
            formControlName="scope"
            optionLabel="label"
            optionValue="value"
            class="w-full border rounded-lg transition-colors duration-200"
            [class.border-red-500]="
              formSubmitted() && accountForm.get('scope')?.invalid
            "
            [class.border-zinc-300]="
              !(formSubmitted() && accountForm.get('scope')?.invalid)
            "
            [class.dark:border-zinc-700]="
              !(formSubmitted() && accountForm.get('scope')?.invalid)
            "
            placeholder="Selecione o escopo"
          ></p-select>
        </div>
      </div>
    </div>
  </form>

  <ng-container footer>
    <p-button
      label="Voltar"
      icon="pi pi-arrow-left"
      severity="secondary"
      [outlined]="true"
      [disabled]="isGlobalLoading()"
      (onClick)="visible.set(false)"
    />

    @if (!isReadOnly()) {
      <p-button
        label="Limpar"
        icon="pi pi-refresh"
        severity="help"
        [outlined]="true"
        [disabled]="isGlobalLoading()"
        (onClick)="clearForm()"
        class="ml-auto"
      />

      <p-button
        label="Salvar"
        icon="pi pi-check-circle"
        severity="success"
        [disabled]="isGlobalLoading()"
        (onClick)="submitForm()"
      />
    }
  </ng-container>
</app-drawer>

<app-confirm-dialog
  #confirmDialog
  acceptLabel="Confirmar"
  rejectLabel="Cancelar"
  acceptIcon="pi pi-check-circle"
  rejectIcon="pi pi-ban"
></app-confirm-dialog>
