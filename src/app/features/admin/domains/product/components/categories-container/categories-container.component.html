<app-breadcrumb [itemsBreadcrumb]="itemsBreadcrumb()" />
<app-spinner [loading]="isLoading()" />

<app-confirm-dialog
  #confirmDialog
  acceptLabel="Confirmar"
  rejectLabel="Cancelar"
  acceptIcon="pi pi-check-circle"
  rejectIcon="pi pi-ban" />

<div class="p-6 max-w-7xl mx-auto space-y-6">
  <app-page-header [title]="title" [description]="description" />

  <div class="bg-white dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800/60 rounded-xl p-4 shadow-sm">
    <p-tabs [value]="activeTab()" (valueChange)="onTabChange($event)">
      <p-tablist>
        <p-tab value="main">
          <i class="pi pi-tags mr-2"></i>
          Categorias Principais
        </p-tab>
        <p-tab value="sub">
          <i class="pi pi-tag mr-2"></i>
          Subcategorias
        </p-tab>
      </p-tablist>

      <p-tabpanels class="pt-4">
        <p-tabpanel value="main">
          <app-main-category-table
            [value]="mainCategories()"
            [totalRecords]="totalRecordsMain()"
            [rows]="rowsMain()"
            [first]="firstMain()"
            [loading]="isLoading()"
            (lazyLoad)="loadMainCategories($event)"
            (searchChange)="onSearchMain($event)"
            (add)="openMainForm(FormMode.Create)"
            (edit)="openMainForm(FormMode.Update, $event)"
            (detail)="openMainForm(FormMode.Detail, $event)"
            (changeStatus)="changeStatusMainCategory($event)"
            (pdfClick)="generateMainCategoryPdfReport()" />
        </p-tabpanel>

        <p-tabpanel value="sub">
          <app-sub-category-table
            [value]="subCategories()"
            [totalRecords]="totalRecordsSub()"
            [rows]="rowsSub()"
            [first]="firstSub()"
            [loading]="isLoading()"
            (lazyLoad)="loadSubCategories($event)"
            (searchChange)="onSearchSub($event)"
            (add)="openSubForm(FormMode.Create)"
            (edit)="openSubForm(FormMode.Update, $event)"
            (detail)="openSubForm(FormMode.Detail, $event)"
            (changeStatus)="changeStatusSubCategory($event)"
            (pdfClick)="generateSubCategoryPdfReport()" />
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </div>

  <app-main-category-drawer-form
    [(visible)]="displayMainDrawer"
    [formMode]="formMode"
    [mainCategoryData]="selectedMainCategory"
    (save)="saveMainCategory($event)" />

  <app-sub-category-drawer-form
    [(visible)]="displaySubDrawer"
    [formMode]="formMode"
    [subCategoryData]="selectedSubCategory"
    (save)="saveSubCategory($event)" />
</div>
