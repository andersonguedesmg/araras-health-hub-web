<app-drawer
  [(visible)]="visible"
  [header]="headerText()"
  [position]="'right'"
  [size]="'xl'"
>
  <div
    *ngIf="isGlobalLoading()"
    class="w-full h-1 bg-zinc-100 dark:bg-zinc-800 overflow-hidden relative mb-4 rounded-full"
  >
    <div
      class="absolute h-full w-1/3 bg-primary animate-pulse rounded-full"
    ></div>
  </div>

  <form
    [formGroup]="facilityForm"
    body
    class="space-y-6"
    [class.opacity-60]="isGlobalLoading()"
  >
    <div
      class="bg-white dark:bg-zinc-900/90 p-5 rounded-xl border border-zinc-200 dark:border-zinc-800 shadow-sm space-y-4"
    >
      <h3
        class="text-xs font-bold text-zinc-400 tracking-wider uppercase flex items-center gap-2"
      >
        <i class="pi pi-building"></i> Identificação
      </h3>
      <hr class="border-zinc-100 dark:border-zinc-800" />

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div *ngIf="formMode() !== FormMode.Create" class="sm:col-span-2">
          <label class="block text-xs font-semibold text-zinc-500 mb-1"
            >ID</label
          >
          <input
            pInputText
            type="text"
            formControlName="id"
            class="w-full bg-zinc-50 dark:bg-zinc-800/50 border border-zinc-200 dark:border-zinc-700 rounded-lg p-2"
          />
        </div>

        <div class="sm:col-span-2">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            Nome da Unidade
            <span class="text-red-500" *ngIf="formMode() !== FormMode.Detail"
              >*</span
            >
          </label>
          <input
            pInputText
            type="text"
            formControlName="name"
            maxlength="150"
            class="w-full border rounded-lg p-2 transition-colors duration-200"
            [ngClass]="
              facilityForm.get('name')?.invalid &&
              facilityForm.get('name')?.touched
                ? 'border-red-500 focus:border-red-500 focus:ring-1 focus:ring-red-500'
                : 'border-zinc-300 dark:border-zinc-700 focus:border-primary'
            "
          />
        </div>

        <div [class.sm:col-span-2]="formMode() === FormMode.Create">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            CNES
            <span class="text-red-500" *ngIf="formMode() !== FormMode.Detail"
              >*</span
            >
          </label>
          <input
            pInputText
            type="text"
            formControlName="cnes"
            maxlength="50"
            class="w-full border rounded-lg p-2 transition-colors duration-200"
            [ngClass]="
              facilityForm.get('cnes')?.invalid &&
              facilityForm.get('cnes')?.touched
                ? 'border-red-500 focus:border-red-500 focus:ring-1 focus:ring-red-500'
                : 'border-zinc-300 dark:border-zinc-700 focus:border-primary'
            "
          />
        </div>

        <div *ngIf="formMode() !== FormMode.Create">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
            >Status</label
          >
          <p-select
            [options]="statusOptions"
            formControlName="isActive"
            optionLabel="label"
            optionValue="value"
            class="w-full border border-zinc-300 dark:border-zinc-700 rounded-lg"
          ></p-select>
        </div>
      </div>
    </div>

    <div
      class="bg-white dark:bg-zinc-900/90 p-5 rounded-xl border border-zinc-200 dark:border-zinc-800 shadow-sm space-y-4"
      formGroupName="address"
    >
      <h3
        class="text-xs font-bold text-zinc-400 tracking-wider uppercase flex items-center gap-2"
      >
        <i class="pi pi-map-marker"></i> Localização
      </h3>
      <hr class="border-zinc-100 dark:border-zinc-800" />

      <div class="grid grid-cols-3 gap-4">
        <div class="col-span-3 sm:col-span-1">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            CEP
            <span class="text-red-500" *ngIf="formMode() !== FormMode.Detail"
              >*</span
            >
          </label>
          <p-inputmask
            mask="99999-999"
            formControlName="cep"
            styleClass="w-full"
            (onBlur)="searchCep()"
            [ngClass]="
              facilityForm.get('address.cep')?.invalid &&
              facilityForm.get('address.cep')?.touched
                ? 'border-red-500'
                : 'border-zinc-300 dark:border-zinc-700'
            "
          />
        </div>

        <div class="col-span-3 sm:col-span-2">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            Endereço (Logradouro)
            <span class="text-red-500" *ngIf="formMode() !== FormMode.Detail"
              >*</span
            >
          </label>
          <input
            pInputText
            type="text"
            formControlName="street"
            class="w-full border rounded-lg p-2"
            [ngClass]="
              facilityForm.get('address.street')?.invalid &&
              facilityForm.get('address.street')?.touched
                ? 'border-red-500 focus:border-red-500 focus:ring-1 focus:ring-red-500'
                : 'border-zinc-300 dark:border-zinc-700 focus:border-primary'
            "
          />
        </div>

        <div class="col-span-3 sm:col-span-1">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            Número
            <span class="text-red-500" *ngIf="formMode() !== FormMode.Detail"
              >*</span
            >
          </label>
          <input
            pInputText
            id="number"
            type="text"
            formControlName="number"
            class="w-full border rounded-lg p-2"
            [ngClass]="
              facilityForm.get('address.number')?.invalid &&
              facilityForm.get('address.number')?.touched
                ? 'border-red-500 focus:border-red-500 focus:ring-1 focus:ring-red-500'
                : 'border-zinc-300 dark:border-zinc-700 focus:border-primary'
            "
          />
        </div>

        <div class="col-span-3 sm:col-span-2">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
            >Complemento</label
          >
          <input
            pInputText
            type="text"
            formControlName="complement"
            class="w-full border border-zinc-300 dark:border-zinc-700 rounded-lg p-2"
          />
        </div>

        <div class="col-span-3 sm:col-span-1">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            Bairro
            <span class="text-red-500" *ngIf="formMode() !== FormMode.Detail"
              >*</span
            >
          </label>
          <input
            pInputText
            type="text"
            formControlName="neighborhood"
            class="w-full border rounded-lg p-2"
            [ngClass]="
              facilityForm.get('address.neighborhood')?.invalid &&
              facilityForm.get('address.neighborhood')?.touched
                ? 'border-red-500 focus:border-red-500 focus:ring-1 focus:ring-red-500'
                : 'border-zinc-300 dark:border-zinc-700 focus:border-primary'
            "
          />
        </div>

        <div class="col-span-3 sm:col-span-1">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            Cidade
            <span class="text-red-500" *ngIf="formMode() !== FormMode.Detail"
              >*</span
            >
          </label>
          <input
            pInputText
            type="text"
            formControlName="city"
            class="w-full border rounded-lg p-2"
            [ngClass]="
              facilityForm.get('address.city')?.invalid &&
              facilityForm.get('address.city')?.touched
                ? 'border-red-500 focus:border-red-500 focus:ring-1 focus:ring-red-500'
                : 'border-zinc-300 dark:border-zinc-700 focus:border-primary'
            "
          />
        </div>

        <div class="col-span-3 sm:col-span-1">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            UF
            <span class="text-red-500" *ngIf="formMode() !== FormMode.Detail"
              >*</span
            >
          </label>
          <input
            pInputText
            type="text"
            formControlName="state"
            maxlength="2"
            class="w-full border rounded-lg p-2"
            [ngClass]="
              facilityForm.get('address.state')?.invalid &&
              facilityForm.get('address.state')?.touched
                ? 'border-red-500 focus:border-red-500 focus:ring-1 focus:ring-red-500'
                : 'border-zinc-300 dark:border-zinc-700 focus:border-primary'
            "
          />
        </div>
      </div>
    </div>

    <div
      class="bg-white dark:bg-zinc-900/90 p-5 rounded-xl border border-zinc-200 dark:border-zinc-800 shadow-sm space-y-4"
      formGroupName="contact"
    >
      <h3
        class="text-xs font-bold text-zinc-400 tracking-wider uppercase flex items-center gap-2"
      >
        <i class="pi pi-envelope"></i> Contato
      </h3>
      <hr class="border-zinc-100 dark:border-zinc-800" />

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="sm:col-span-2">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            E-mail
            <span class="text-red-500" *ngIf="formMode() !== FormMode.Detail"
              >*</span
            >
          </label>
          <input
            pInputText
            type="text"
            formControlName="email"
            class="w-full border rounded-lg p-2"
            [ngClass]="
              facilityForm.get('contact.email')?.invalid &&
              facilityForm.get('contact.email')?.touched
                ? 'border-red-500 focus:border-red-500 focus:ring-1 focus:ring-red-500'
                : 'border-zinc-300 dark:border-zinc-700 focus:border-primary'
            "
          />
        </div>
        <div class="sm:col-span-2">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            Telefone
            <span class="text-red-500" *ngIf="formMode() !== FormMode.Detail"
              >*</span
            >
          </label>
          <p-inputmask
            mask="(99) 9999-9999"
            formControlName="phone"
            styleClass="w-full"
            [ngClass]="
              facilityForm.get('contact.phone')?.invalid &&
              facilityForm.get('contact.phone')?.touched
                ? 'border-red-500 focus:border-red-500 focus:ring-1 focus:ring-red-500'
                : 'border-zinc-300 dark:border-zinc-700 focus:border-primary'
            "
          />
        </div>
      </div>
    </div>
  </form>

  <ng-container footer>
    <p-button
      label="Cancelar"
      icon="pi pi-ban"
      severity="secondary"
      [outlined]="true"
      [disabled]="isGlobalLoading()"
      (click)="visible.set(false)"
    />
    <p-button
      *ngIf="formMode() !== FormMode.Detail"
      label="Salvar"
      icon="pi pi-check-circle"
      severity="primary"
      [disabled]="isGlobalLoading()"
      (click)="submitForm()"
    />
  </ng-container>
</app-drawer>
