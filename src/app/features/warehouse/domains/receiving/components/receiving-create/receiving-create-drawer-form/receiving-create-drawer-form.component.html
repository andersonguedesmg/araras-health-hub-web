<app-drawer [(visible)]="visible" [header]="headerText()" [position]="'right'" [size]="'lg'">
  @if (isGlobalLoading()) {
    <div class="w-full h-1 bg-zinc-100 dark:bg-zinc-800 overflow-hidden relative mb-4 rounded-full">
      <div class="absolute h-full w-1/3 bg-primary animate-pulse rounded-full"></div>
    </div>
  }

  <form [formGroup]="form" body class="space-y-6" [class.opacity-60]="isGlobalLoading()">
    <div
      class="bg-white dark:bg-zinc-900/90 p-5 rounded-xl border border-zinc-200 dark:border-zinc-800 shadow-sm space-y-4">
      <h3 class="text-xs font-bold text-zinc-400 tracking-wider uppercase flex items-center gap-2">
        <i class="pi pi-box"></i>
        Dados do Item de Recebimento
      </h3>
      <hr class="border-zinc-100 dark:border-zinc-800" />

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1" for="product">
            Produto
            @if (!isReadOnly()) {
              <span class="text-red-500">*</span>
            }
          </label>

          <p-select
            id="product"
            [options]="productOptions()"
            formControlName="product"
            optionLabel="label"
            placeholder="Selecione ou busque um produto"
            styleClass="w-full"
            [class.border-red-500]="formSubmitted() && form.get('product')?.invalid"
            [virtualScroll]="true"
            [virtualScrollItemSize]="38"
            [lazy]="true"
            (onLazyLoad)="onProductLazyLoad($event)"
            [filter]="true"
            (onFilter)="onProductFilter($event)"
            (onChange)="onProductSelect($event.value)"
            [loading]="isProductLoading()">
            <ng-template pTemplate="selectedItem" let-selected>
              @if (selected) {
                <div class="flex items-center gap-2 text-xs">
                  <span class="font-medium text-zinc-800 dark:text-zinc-200">{{ selected.label }}</span>
                </div>
              }
            </ng-template>
            <ng-template pTemplate="item" let-prod>
              <div class="flex flex-col text-xs py-0.5">
                <span class="font-medium text-zinc-800 dark:text-zinc-200">{{ prod.label }}</span>
                @if (prod.brand) {
                  <span class="text-[11px] text-zinc-400">Marca/Fabricante: {{ prod.brand }}</span>
                }
              </div>
            </ng-template>
            <ng-template pTemplate="empty">
              <span class="p-4 text-xs text-zinc-500 block">Nenhum produto encontrado</span>
            </ng-template>
          </p-select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1" for="brand">
            Marca / Fabricante
            @if (!isReadOnly()) {
              <span class="text-red-500">*</span>
            }
          </label>

          <input
            id="brand"
            pInputText
            type="text"
            formControlName="brand"
            placeholder="Ex: Medley, EMS, Eurofarma"
            maxlength="200"
            class="w-full border rounded-lg p-2 transition-colors duration-200 bg-zinc-50/50 dark:bg-zinc-800/30 text-zinc-800 dark:text-zinc-100 focus:border-primary focus:outline-none disabled:bg-zinc-100/70 disabled:dark:bg-zinc-800/60 disabled:text-zinc-500 disabled:dark:text-zinc-400 disabled:shadow-inner"
            [class.border-zinc-300]="!(formSubmitted() && form.get('brand')?.invalid)"
            [class.dark:border-zinc-700]="!(formSubmitted() && form.get('brand')?.invalid)"
            [class.border-red-500]="formSubmitted() && form.get('brand')?.invalid"
            [class.focus:border-red-500]="formSubmitted() && form.get('brand')?.invalid"
            [class.focus:ring-1]="formSubmitted() && form.get('brand')?.invalid"
            [class.focus:ring-red-500]="formSubmitted() && form.get('brand')?.invalid" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1" for="batch">
              Lote
              @if (!isReadOnly()) {
                <span class="text-red-500">*</span>
              }
            </label>
            <input
              id="batch"
              pInputText
              type="text"
              formControlName="batch"
              maxlength="200"
              placeholder="Ex: LOT-2026-99"
              class="w-full border rounded-lg p-2 transition-colors duration-200 bg-zinc-50/50 dark:bg-zinc-800/30 text-zinc-800 dark:text-zinc-100 focus:border-primary focus:outline-none disabled:bg-zinc-100/70 disabled:dark:bg-zinc-800/60 disabled:text-zinc-500 disabled:dark:text-zinc-400 disabled:shadow-inner"
              [class.border-zinc-300]="!(formSubmitted() && form.get('batch')?.invalid)"
              [class.dark:border-zinc-700]="!(formSubmitted() && form.get('batch')?.invalid)"
              [class.border-red-500]="formSubmitted() && form.get('batch')?.invalid"
              [class.focus:border-red-500]="formSubmitted() && form.get('batch')?.invalid"
              [class.focus:ring-1]="formSubmitted() && form.get('batch')?.invalid"
              [class.focus:ring-red-500]="formSubmitted() && form.get('batch')?.invalid" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1" for="expiryDate">
              Data de Validade
              @if (!isReadOnly()) {
                <span class="text-red-500">*</span>
              }
            </label>
            <p-datePicker
              id="expiryDate"
              formControlName="expiryDate"
              dateFormat="dd/mm/yy"
              [showIcon]="true"
              placeholder="dd/mm/aaaa"
              styleClass="w-full"
              inputStyleClass="w-full text-xs p-2"
              [appendTo]="'body'"
              [class.border-red-500]="formSubmitted() && form.get('expiryDate')?.invalid" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1" for="quantity">
              Quantidade
              @if (!isReadOnly()) {
                <span class="text-red-500">*</span>
              }
            </label>
            <p-inputNumber
              id="quantity"
              formControlName="quantity"
              [min]="1"
              [showButtons]="true"
              buttonLayout="horizontal"
              spinnerMode="horizontal"
              decrementButtonClass="p-button-secondary p-2"
              incrementButtonClass="p-button-secondary p-2"
              incrementButtonIcon="pi pi-plus"
              decrementButtonIcon="pi pi-minus"
              styleClass="w-full"
              inputStyleClass="w-full text-center text-xs p-2 font-semibold"
              [class.border-red-500]="formSubmitted() && form.get('quantity')?.invalid" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1" for="unitValue">
              Valor Unitário (R$)
              @if (!isReadOnly()) {
                <span class="text-red-500">*</span>
              }
            </label>
            <p-inputNumber
              id="unitValue"
              formControlName="unitValue"
              mode="currency"
              currency="BRL"
              locale="pt-BR"
              [min]="0.01"
              styleClass="w-full"
              inputStyleClass="w-full text-xs p-2 text-right font-semibold"
              [class.border-red-500]="formSubmitted() && form.get('unitValue')?.invalid" />
          </div>
        </div>
      </div>
    </div>
  </form>

  <ng-container footer>
    <p-button
      label="Voltar"
      icon="pi pi-arrow-left"
      severity="secondary"
      [outlined]="true"
      [disabled]="isGlobalLoading()"
      (onClick)="closeDrawer()" />

    @if (!isReadOnly()) {
      <p-button
        label="Limpar"
        icon="pi pi-refresh"
        severity="help"
        [outlined]="true"
        [disabled]="isGlobalLoading()"
        (onClick)="clearForm()"
        class="ml-auto" />

      <p-button
        [label]="formMode() === FormMode.Update ? 'Atualizar Item' : 'Adicionar ao Recebimento'"
        icon="pi pi-check-circle"
        severity="success"
        [disabled]="isGlobalLoading()"
        (onClick)="submitForm()" />
    }
  </ng-container>
</app-drawer>

<app-confirm-dialog
  #confirmDialog
  acceptLabel="Confirmar"
  rejectLabel="Cancelar"
  acceptIcon="pi pi-check-circle"
  rejectIcon="pi pi-ban" />
