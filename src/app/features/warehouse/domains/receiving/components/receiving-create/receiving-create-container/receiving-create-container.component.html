<app-breadcrumb [itemsBreadcrumb]="itemsBreadcrumb()" />
<app-spinner [loading]="isLoading()" />

<app-confirm-dialog
  #confirmDialog
  acceptLabel="Confirmar"
  rejectLabel="Cancelar"
  acceptIcon="pi pi-check-circle"
  rejectIcon="pi pi-ban" />

<div class="p-6 max-w-7xl mx-auto space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <app-page-header [title]="title" [description]="description" />

    <div class="flex items-center gap-2 self-end sm:self-auto">
      <button
        type="button"
        class="px-4 py-2 text-sm font-medium text-zinc-700 bg-white border border-zinc-300 rounded-lg hover:bg-zinc-50 dark:bg-zinc-800 dark:text-zinc-200 dark:border-zinc-700 dark:hover:bg-zinc-700/50 transition-colors"
        (click)="cancel()">
        Cancelar
      </button>
      <button
        type="button"
        class="px-4 py-2 text-sm font-medium text-white bg-emerald-600 rounded-lg hover:bg-emerald-700 disabled:opacity-50 transition-colors flex items-center gap-2"
        [disabled]="isLoading()"
        (click)="handleSubmit()">
        <i class="pi pi-check-circle"></i>
        Salvar
      </button>
    </div>
  </div>

  <app-receiving-create-header-form
    #headerForm
    [calculatedItemsTotal]="calculatedItemsTotal()"
    (formChange)="handleHeaderFormChange($event)" />

  <app-receiving-create-table
    [items]="receivedItems()"
    [declaredTotalValue]="headerFormData()?.totalValue ?? 0"
    [calculatedTotalValue]="calculatedItemsTotal()"
    (addItem)="openItemDrawer(FormMode.Create)"
    (editItem)="openItemDrawer(FormMode.Update, $event.item, $event.index)"
    (removeItem)="handleRemoveItem($event)" />

  <app-receiving-create-drawer-form
    [(visible)]="displayDrawer"
    [formMode]="drawerMode"
    [itemData]="selectedItem()"
    (save)="handleSaveItem($event)" />
</div>
