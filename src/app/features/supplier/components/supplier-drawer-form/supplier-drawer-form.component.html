<app-drawer
  [(visible)]="visible"
  [header]="headerText()"
  [position]="'right'"
  [size]="'xl'"
>
  <div
    *ngIf="isGlobalLoading()"
    class="w-full h-1 bg-zinc-100 dark:bg-zinc-800 overflow-hidden relative mb-4 rounded-full"
  >
    <div
      class="absolute h-full w-1/3 bg-primary animate-pulse rounded-full"
    ></div>
  </div>

  <form
    [formGroup]="supplierForm"
    body
    class="space-y-6"
    [class.opacity-60]="isGlobalLoading()"
  >
    <div
      class="bg-white dark:bg-zinc-900/90 p-5 rounded-xl border border-zinc-200 dark:border-zinc-800 shadow-sm space-y-4"
    >
      <h3
        class="text-xs font-bold text-zinc-400 tracking-wider uppercase flex items-center gap-2"
      >
        <i class="pi pi-building"></i> Identificação
      </h3>
      <hr class="border-zinc-100 dark:border-zinc-800" />

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <ng-container *ngIf="formMode() !== FormMode.Create">
          <div>
            <label class="block text-xs font-semibold text-zinc-500 mb-1"
              >ID</label
            >
            <input
              pInputText
              type="text"
              formControlName="id"
              class="w-full bg-zinc-100/70 dark:bg-zinc-800/60 border border-zinc-200 dark:border-zinc-700 text-zinc-500 dark:text-zinc-400 rounded-lg p-2 font-medium cursor-not-allowed shadow-inner"
            />
          </div>

          <div>
            <label class="block text-xs font-semibold text-zinc-500 mb-1"
              >Status</label
            >
            <input
              pInputText
              type="text"
              [value]="statusLabel()"
              disabled
              class="w-full bg-zinc-100/70 dark:bg-zinc-800/60 border border-zinc-200 dark:border-zinc-700 text-zinc-500 dark:text-zinc-400 rounded-lg p-2 font-medium cursor-not-allowed shadow-inner"
            />
          </div>
        </ng-container>

        <div class="sm:col-span-2">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            Razão Social
            <span class="text-red-500" *ngIf="formMode() !== FormMode.Detail"
              >*</span
            >
          </label>
          <input
            pInputText
            type="text"
            formControlName="legalName"
            maxlength="150"
            class="w-full border rounded-lg p-2 transition-colors duration-200 bg-zinc-50/50 dark:bg-zinc-800/30 text-zinc-800 dark:text-zinc-100"
            [ngClass]="{
              'border-red-500 focus:border-red-500 focus:ring-1 focus:ring-red-500':
                supplierForm.get('legalName')?.invalid &&
                supplierForm.get('legalName')?.touched,
              'border-zinc-300 dark:border-zinc-700 focus:border-primary': !(
                supplierForm.get('legalName')?.invalid &&
                supplierForm.get('legalName')?.touched
              ),
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner cursor-not-allowed':
                formMode() === FormMode.Update && statusLabel() === 'Inativo',
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner':
                formMode() === FormMode.Detail,
            }"
          />
        </div>

        <div class="sm:col-span-2">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            Nome Fantasia
          </label>
          <input
            pInputText
            type="text"
            formControlName="tradeName"
            maxlength="50"
            class="w-full border rounded-lg p-2 transition-colors duration-200 bg-zinc-50/50 dark:bg-zinc-800/30 text-zinc-800 dark:text-zinc-100"
            [ngClass]="{
              'border-zinc-300 dark:border-zinc-700 focus:border-primary': true,
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner cursor-not-allowed':
                formMode() === FormMode.Update && statusLabel() === 'Inativo',
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner':
                formMode() === FormMode.Detail,
            }"
          />
        </div>

        <div [class.sm:col-span-2]="formMode() === FormMode.Create">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            CNPJ
            <span class="text-red-500" *ngIf="formMode() !== FormMode.Detail"
              >*</span
            >
          </label>
          <p-inputmask
            mask="99.999.999/9999-99"
            formControlName="cnpj"
            styleClass="w-full"
            (onBlur)="validateCnpj()"
            [ngClass]="{
              'border-red-500':
                supplierForm.get('cnpj')?.invalid &&
                supplierForm.get('cnpj')?.touched,
              'border-zinc-300 dark:border-zinc-700': !(
                supplierForm.get('cnpj')?.invalid &&
                supplierForm.get('cnpj')?.touched
              ),
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner cursor-not-allowed':
                formMode() === FormMode.Update && statusLabel() === 'Inativo',
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner':
                formMode() === FormMode.Detail,
            }"
          />
          <small
            *ngIf="
              supplierForm.get('cnpj')?.hasError('invalidCnpj') &&
              supplierForm.get('cnpj')?.touched
            "
            class="text-red-500 text-xs block mt-1"
          >
            Número de CNPJ inválido.
          </small>
        </div>
      </div>
    </div>

    <div
      class="bg-white dark:bg-zinc-900/90 p-5 rounded-xl border border-zinc-200 dark:border-zinc-800 shadow-sm space-y-4"
      formGroupName="address"
    >
      <h3
        class="text-xs font-bold text-zinc-400 tracking-wider uppercase flex items-center gap-2"
      >
        <i class="pi pi-map-marker"></i> Localização
      </h3>
      <hr class="border-zinc-100 dark:border-zinc-800" />

      <div class="grid grid-cols-3 gap-4">
        <div class="col-span-3 sm:col-span-1">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            CEP
            <span class="text-red-500" *ngIf="formMode() !== FormMode.Detail"
              >*</span
            >
          </label>
          <p-inputmask
            mask="99999-999"
            formControlName="cep"
            styleClass="w-full"
            (onBlur)="searchCep()"
            [ngClass]="{
              'border-red-500':
                supplierForm.get('address.cep')?.invalid &&
                supplierForm.get('address.cep')?.touched,
              'border-zinc-300 dark:border-zinc-700': !(
                supplierForm.get('address.cep')?.invalid &&
                supplierForm.get('address.cep')?.touched
              ),
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner cursor-not-allowed':
                formMode() === FormMode.Update && statusLabel() === 'Inativo',
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner':
                formMode() === FormMode.Detail,
            }"
          />
        </div>

        <div class="col-span-3 sm:col-span-2">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            Logradouro
            <span class="text-red-500" *ngIf="formMode() !== FormMode.Detail"
              >*</span
            >
          </label>
          <input
            pInputText
            type="text"
            formControlName="street"
            class="w-full border rounded-lg p-2 transition-colors duration-200 bg-zinc-50/50 dark:bg-zinc-800/30 text-zinc-800 dark:text-zinc-100"
            [ngClass]="{
              'border-red-500 focus:border-red-500 focus:ring-1 focus:ring-red-500':
                supplierForm.get('address.street')?.invalid &&
                supplierForm.get('address.street')?.touched,
              'border-zinc-300 dark:border-zinc-700 focus:border-primary': !(
                supplierForm.get('address.street')?.invalid &&
                supplierForm.get('address.street')?.touched
              ),
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner cursor-not-allowed':
                formMode() === FormMode.Update && statusLabel() === 'Inativo',
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner':
                formMode() === FormMode.Detail,
            }"
          />
        </div>

        <div class="col-span-3 sm:col-span-1">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            Número
            <span class="text-red-500" *ngIf="formMode() !== FormMode.Detail"
              >*</span
            >
          </label>
          <input
            pInputText
            id="number"
            type="text"
            formControlName="number"
            class="w-full border rounded-lg p-2 transition-colors duration-200 bg-zinc-50/50 dark:bg-zinc-800/30 text-zinc-800 dark:text-zinc-100"
            [ngClass]="{
              'border-red-500 focus:border-red-500 focus:ring-1 focus:ring-red-500':
                supplierForm.get('address.number')?.invalid &&
                supplierForm.get('address.number')?.touched,
              'border-zinc-300 dark:border-zinc-700 focus:border-primary': !(
                supplierForm.get('address.number')?.invalid &&
                supplierForm.get('address.number')?.touched
              ),
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner cursor-not-allowed':
                formMode() === FormMode.Update && statusLabel() === 'Inativo',
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner':
                formMode() === FormMode.Detail,
            }"
          />
        </div>

        <div class="col-span-3 sm:col-span-2">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            Complemento
          </label>
          <input
            pInputText
            type="text"
            formControlName="complement"
            class="w-full border rounded-lg p-2 transition-colors duration-200 bg-zinc-50/50 dark:bg-zinc-800/30 text-zinc-800 dark:text-zinc-100"
            [ngClass]="{
              'border-zinc-300 dark:border-zinc-700 focus:border-primary': true,
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner cursor-not-allowed':
                formMode() === FormMode.Update && statusLabel() === 'Inativo',
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner':
                formMode() === FormMode.Detail,
            }"
          />
        </div>

        <div class="col-span-3 sm:col-span-1">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            Bairro
            <span class="text-red-500" *ngIf="formMode() !== FormMode.Detail"
              >*</span
            >
          </label>
          <input
            pInputText
            type="text"
            formControlName="neighborhood"
            class="w-full border rounded-lg p-2 transition-colors duration-200 bg-zinc-50/50 dark:bg-zinc-800/30 text-zinc-800 dark:text-zinc-100"
            [ngClass]="{
              'border-red-500 focus:border-red-500 focus:ring-1 focus:ring-red-500':
                supplierForm.get('address.neighborhood')?.invalid &&
                supplierForm.get('address.neighborhood')?.touched,
              'border-zinc-300 dark:border-zinc-700 focus:border-primary': !(
                supplierForm.get('address.neighborhood')?.invalid &&
                supplierForm.get('address.neighborhood')?.touched
              ),
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner cursor-not-allowed':
                formMode() === FormMode.Update && statusLabel() === 'Inativo',
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner':
                formMode() === FormMode.Detail,
            }"
          />
        </div>

        <div class="col-span-3 sm:col-span-1">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            Cidade
            <span class="text-red-500" *ngIf="formMode() !== FormMode.Detail"
              >*</span
            >
          </label>
          <input
            pInputText
            type="text"
            formControlName="city"
            class="w-full border rounded-lg p-2 transition-colors duration-200 bg-zinc-50/50 dark:bg-zinc-800/30 text-zinc-800 dark:text-zinc-100"
            [ngClass]="{
              'border-red-500 focus:border-red-500 focus:ring-1 focus:ring-red-500':
                supplierForm.get('address.city')?.invalid &&
                supplierForm.get('address.city')?.touched,
              'border-zinc-300 dark:border-zinc-700 focus:border-primary': !(
                supplierForm.get('address.city')?.invalid &&
                supplierForm.get('address.city')?.touched
              ),
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner cursor-not-allowed':
                formMode() === FormMode.Update && statusLabel() === 'Inativo',
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner':
                formMode() === FormMode.Detail,
            }"
          />
        </div>

        <div class="col-span-3 sm:col-span-1">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            UF
            <span class="text-red-500" *ngIf="formMode() !== FormMode.Detail"
              >*</span
            >
          </label>
          <input
            pInputText
            type="text"
            formControlName="state"
            maxlength="2"
            class="w-full border rounded-lg p-2 transition-colors duration-200 bg-zinc-50/50 dark:bg-zinc-800/30 text-zinc-800 dark:text-zinc-100"
            [ngClass]="{
              'border-red-500 focus:border-red-500 focus:ring-1 focus:ring-red-500':
                supplierForm.get('address.state')?.invalid &&
                supplierForm.get('address.state')?.touched,
              'border-zinc-300 dark:border-zinc-700 focus:border-primary': !(
                supplierForm.get('address.state')?.invalid &&
                supplierForm.get('address.state')?.touched
              ),
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner cursor-not-allowed':
                formMode() === FormMode.Update && statusLabel() === 'Inativo',
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner':
                formMode() === FormMode.Detail,
            }"
          />
        </div>
      </div>
    </div>

    <div
      class="bg-white dark:bg-zinc-900/90 p-5 rounded-xl border border-zinc-200 dark:border-zinc-800 shadow-sm space-y-4"
      formGroupName="contact"
    >
      <h3
        class="text-xs font-bold text-zinc-400 tracking-wider uppercase flex items-center gap-2"
      >
        <i class="pi pi-envelope"></i> Contato
      </h3>
      <hr class="border-zinc-100 dark:border-zinc-800" />

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="sm:col-span-2">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            E-mail
            <span class="text-red-500" *ngIf="formMode() !== FormMode.Detail"
              >*</span
            >
          </label>
          <input
            pInputText
            type="text"
            formControlName="email"
            class="w-full border rounded-lg p-2 transition-colors duration-200 bg-zinc-50/50 dark:bg-zinc-800/30 text-zinc-800 dark:text-zinc-100"
            [ngClass]="{
              'border-red-500 focus:border-red-500 focus:ring-1 focus:ring-red-500':
                supplierForm.get('contact.email')?.invalid &&
                supplierForm.get('contact.email')?.touched,
              'border-zinc-300 dark:border-zinc-700 focus:border-primary': !(
                supplierForm.get('contact.email')?.invalid &&
                supplierForm.get('contact.email')?.touched
              ),
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner cursor-not-allowed':
                formMode() === FormMode.Update && statusLabel() === 'Inativo',
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner':
                formMode() === FormMode.Detail,
            }"
          />
        </div>

        <div class="sm:col-span-2">
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            Telefone
            <span class="text-red-500" *ngIf="formMode() !== FormMode.Detail"
              >*</span
            >
          </label>
          <p-inputmask
            mask="(99) 99999-9999"
            formControlName="phone"
            styleClass="w-full"
            [ngClass]="{
              'border-red-500 focus:border-red-500 focus:ring-1 focus:ring-red-500':
                supplierForm.get('contact.phone')?.invalid &&
                supplierForm.get('contact.phone')?.touched,
              'border-zinc-300 dark:border-zinc-700 focus:border-primary': !(
                supplierForm.get('contact.phone')?.invalid &&
                supplierForm.get('contact.phone')?.touched
              ),
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner cursor-not-allowed':
                formMode() === FormMode.Update && statusLabel() === 'Inativo',
              'bg-zinc-100/70 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 shadow-inner':
                formMode() === FormMode.Detail,
            }"
          />
        </div>
      </div>
    </div>
  </form>

  <ng-container footer>
    <p-button
      label="Cancelar"
      icon="pi pi-ban"
      severity="secondary"
      [outlined]="true"
      [disabled]="isGlobalLoading()"
      (click)="visible.set(false)"
    />
    <p-button
      *ngIf="!isReadOnly()"
      label="Salvar"
      icon="pi pi-check-circle"
      severity="primary"
      [disabled]="isGlobalLoading()"
      (click)="submitForm()"
    />
  </ng-container>
</app-drawer>

<app-confirm-dialog
  #confirmDialog
  acceptLabel="Confirmar"
  rejectLabel="Cancelar"
  acceptIcon="pi pi-check-circle"
  rejectIcon="pi pi-ban"
></app-confirm-dialog>
