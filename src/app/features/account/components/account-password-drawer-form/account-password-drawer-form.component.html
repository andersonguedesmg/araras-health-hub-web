<app-drawer
  [(visible)]="visible"
  [header]="'Alterar Senha - ' + accountName()"
  [position]="'right'"
  [size]="'md'"
>
  <div
    *ngIf="isGlobalLoading()"
    class="w-full h-1 bg-zinc-100 dark:bg-zinc-800 overflow-hidden relative mb-4 rounded-full"
  >
    <div
      class="absolute h-full w-1/3 bg-primary animate-pulse rounded-full"
    ></div>
  </div>

  <form
    [formGroup]="passwordForm"
    body
    class="space-y-6"
    [class.opacity-60]="isGlobalLoading()"
  >
    <div
      class="bg-white dark:bg-zinc-900/90 p-5 rounded-xl border border-zinc-200 dark:border-zinc-800 shadow-sm space-y-4"
    >
      <h3
        class="text-xs font-bold text-zinc-400 tracking-wider uppercase flex items-center gap-2"
      >
        <i class="pi pi-lock"></i> Credenciais de Acesso
      </h3>
      <hr class="border-zinc-100 dark:border-zinc-800" />

      <div class="grid grid-cols-1 gap-4">
        <div>
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            Nova Senha <span class="text-red-500">*</span>
          </label>
          <input
            pInputText
            type="password"
            formControlName="password"
            placeholder="Digite a nova senha"
            class="w-full border rounded-lg p-2 transition-colors duration-200 bg-zinc-50/50 dark:bg-zinc-800/30 text-zinc-800 dark:text-zinc-100"
            [ngClass]="{
              'border-red-500 focus:border-red-500 focus:ring-1 focus:ring-red-500':
                passwordForm.get('password')?.invalid &&
                passwordForm.get('password')?.touched,
              'border-zinc-300 dark:border-zinc-700 focus:border-primary': !(
                passwordForm.get('password')?.invalid &&
                passwordForm.get('password')?.touched
              ),
            }"
          />
        </div>

        <div>
          <label
            class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1"
          >
            Confirmar Nova Senha <span class="text-red-500">*</span>
          </label>
          <input
            pInputText
            type="password"
            formControlName="confirmPassword"
            placeholder="Repita a nova senha"
            class="w-full border rounded-lg p-2 transition-colors duration-200 bg-zinc-50/50 dark:bg-zinc-800/30 text-zinc-800 dark:text-zinc-100"
            [ngClass]="{
              'border-red-500 focus:border-red-500 focus:ring-1 focus:ring-red-500':
                (passwordForm.get('confirmPassword')?.invalid ||
                  passwordForm.hasError('mismatch')) &&
                passwordForm.get('confirmPassword')?.touched,
              'border-zinc-300 dark:border-zinc-700 focus:border-primary': !(
                (passwordForm.get('confirmPassword')?.invalid ||
                  passwordForm.hasError('mismatch')) &&
                passwordForm.get('confirmPassword')?.touched
              ),
            }"
          />
          <small
            *ngIf="
              passwordForm.hasError('mismatch') &&
              passwordForm.get('confirmPassword')?.touched
            "
            class="text-red-500 text-xs block mt-1"
          >
            As senhas não conferem.
          </small>
        </div>
      </div>
    </div>
  </form>

  <ng-container footer>
    <p-button
      label="Cancelar"
      icon="pi pi-ban"
      severity="secondary"
      [outlined]="true"
      [disabled]="isGlobalLoading()"
      (click)="visible.set(false)"
    />
    <p-button
      label="Atualizar Senha"
      icon="pi pi-key"
      severity="primary"
      [disabled]="isGlobalLoading()"
      (click)="submitForm()"
    />
  </ng-container>
</app-drawer>

<app-confirm-dialog
  #confirmDialog
  acceptLabel="Confirmar"
  rejectLabel="Cancelar"
  acceptIcon="pi pi-check-circle"
  rejectIcon="pi pi-ban"
></app-confirm-dialog>
