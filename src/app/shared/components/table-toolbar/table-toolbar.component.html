<div
  class="flex flex-col sm:flex-row gap-4 items-center justify-between w-full py-2 bg-white dark:bg-zinc-950 transition-colors duration-200"
>
  <div class="w-full sm:w-72">
    <p-iconfield class="w-full block">
      <p-inputicon
        styleClass="pi pi-search text-zinc-400 dark:text-zinc-500 text-sm flex items-center justify-center"
      />
      <input
        pInputText
        type="text"
        [placeholder]="searchPlaceholder()"
        class="w-full h-9 pl-9 pr-3 text-sm bg-zinc-50 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 text-zinc-900 dark:text-zinc-100 rounded-lg placeholder-zinc-400 dark:placeholder-zinc-500 focus:bg-white dark:focus:bg-zinc-950 focus:border-zinc-400 dark:focus:border-zinc-600 focus:outline-hidden focus:ring-2 focus:ring-zinc-100 dark:focus:ring-zinc-800/50 transition-all duration-200"
        (input)="handleSearch($event)"
      />
    </p-iconfield>
  </div>

  <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
    @if (showPdfButton()) {
      <p-button
        icon="pi pi-file-pdf"
        severity="secondary"
        [loading]="pdfLoading()"
        [pTooltip]="pdfButtonTooltip()"
        tooltipPosition="top"
        styleClass="w-9 h-9 p-0 flex items-center justify-center rounded-lg border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 text-zinc-700 dark:text-zinc-300 hover:bg-zinc-50 dark:hover:bg-zinc-800/60 active:bg-zinc-100 dark:active:bg-zinc-800 text-sm transition-all duration-150 shadow-none"
        [dt]="{ icon: { class: 'text-sm' } }"
        (click)="onPdfClick.emit()"
      />
    }

    @if (showActionButton()) {
      <p-button
        [icon]="buttonIcon()"
        severity="primary"
        [pTooltip]="buttonTooltip()"
        tooltipPosition="top"
        styleClass="w-9 h-9 p-0 flex items-center justify-center rounded-lg bg-zinc-900 dark:bg-zinc-50 text-white dark:text-zinc-950 hover:bg-zinc-800 dark:hover:bg-zinc-200 active:bg-zinc-950 dark:active:bg-white border-none text-sm transition-all duration-150 shadow-xs"
        [dt]="{ icon: { class: 'text-sm' } }"
        (click)="onActionClick.emit()"
      />
    }
  </div>
</div>
