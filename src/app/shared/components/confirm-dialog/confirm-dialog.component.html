<p-confirmDialog
  [style]="{ width: '440px', 'max-width': '92vw' }"
  [blockScroll]="true"
  [closable]="false"
  maskStyleClass="backdrop-blur-sm bg-zinc-950/40 dark:bg-zinc-950/60 transition-all duration-300"
  styleClass="border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 rounded-xl shadow-2xl overflow-hidden"
>
  <ng-template pTemplate="headless" let-message let-header="header">
    <div class="flex flex-col p-6 bg-white dark:bg-zinc-900">
      <div class="flex items-center gap-3 pb-3">
        @if (message.icon) {
          <i
            [class]="message.icon"
            class="text-xl text-orange-500 dark:text-amber-500 flex-shrink-0"
          ></i>
        }
        <h3
          class="text-lg font-bold text-zinc-900 dark:text-zinc-50 tracking-tight"
        >
          {{ message.header }}
        </h3>
      </div>

      <div
        class="text-sm text-zinc-600 dark:text-zinc-300 pb-6 pl-0 sm:pl-8 leading-relaxed"
      >
        {{ message.message }}
      </div>

      <div
        class="flex justify-end gap-3 pt-4 border-t border-zinc-100 dark:border-zinc-800/60"
      >
        <p-button
          [label]="message.rejectLabel"
          [icon]="message.rejectIcon"
          [severity]="message.rejectButtonProps?.severity"
          [outlined]="message.rejectButtonProps?.outlined"
          styleClass="text-xs font-semibold px-4 py-2 rounded-lg transition-all duration-200 shadow-none"
          (click)="onReject()"
        />

        <p-button
          [label]="message.acceptLabel"
          [icon]="message.acceptIcon"
          [severity]="message.acceptButtonProps?.severity"
          [outlined]="message.acceptButtonProps?.outlined"
          styleClass="text-xs font-semibold px-4 py-2 rounded-lg transition-all duration-200 shadow-none"
          (click)="onAccept()"
        />
      </div>
    </div>
  </ng-template>
</p-confirmDialog>
