<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  [styleClass]="computedStyleClass()"
  maskStyleClass="bg-zinc-900/40 dark:bg-zinc-950/60 backdrop-blur-sm"
  contentStyleClass="p-6 bg-surface-0 dark:bg-surface-900 text-surface-700 dark:text-surface-0/80">
  <ng-template #header>
    <div
      class="flex items-center gap-2 w-full p-4 border-b border-surface-200 dark:border-surface-800 bg-surface-50/50 dark:bg-surface-900/50 rounded-t-xl">
      <span class="text-lg font-semibold text-surface-900 dark:text-surface-0">
        {{ resolvedHeaderText() }}
      </span>
    </div>
  </ng-template>

  <ng-content />

  <ng-template #footer>
    <div
      class="flex items-center justify-end gap-2 w-full p-4 border-t border-surface-200 dark:border-surface-800 bg-surface-50/30 dark:bg-surface-900/30 rounded-b-xl">
      <p-button
        [label]="cancelButtonLabel()"
        severity="secondary"
        [text]="true"
        size="small"
        styleClass="text-xs font-medium"
        (onClick)="handleCancel()" />

      @if (showSaveButton() && formMode() !== FormMode.Detail) {
        <p-button
          [label]="saveButtonLabel()"
          severity="primary"
          size="small"
          styleClass="text-xs font-medium"
          (onClick)="handleSave()" />
      }
    </div>
  </ng-template>
</p-dialog>
