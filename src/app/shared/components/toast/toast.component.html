<p-toast position="top-right" [life]="5000">
  <ng-template let-message pTemplate="message">
    <div class="flex flex-col w-full text-white pl-1">
      <div class="flex items-center text-base font-bold tracking-wide">
        @switch (message.severity) {
          @case ("success") {
            <i class="pi pi-check-circle text-lg mr-2"></i>
          }
          @case ("error") {
            <i class="pi pi-times-circle text-lg mr-2"></i>
          }
          @case ("warn") {
            <i class="pi pi-exclamation-triangle text-lg mr-2"></i>
          }
          @default {
            <i class="pi pi-info-circle text-lg mr-2"></i>
          }
        }
        <span>{{ message.summary }}</span>
      </div>
      <div
        [innerHTML]="message.detail"
        class="mt-1 text-sm pl-7 text-white/90 font-medium"
      ></div>
    </div>
  </ng-template>
</p-toast>
