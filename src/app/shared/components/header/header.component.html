<p-menubar
  [model]="items()"
  class="w-full block"
  styleClass="!rounded-none !border-t-0 !border-x-0 border-b border-surface-200 dark:border-surface-800"
>
  <ng-template #start>
    <div
      class="flex items-center space-x-2 mr-6 select-none cursor-pointer"
      routerLink="/"
    >
      <img
        src="assets/a2h-menu.png"
        alt="Logo Araras Health Hub"
        class="h-9 object-contain"
      />
    </div>
  </ng-template>

  <ng-template #end>
    <div class="flex items-center gap-4">
      <p-button
        [icon]="themeIcon()"
        severity="secondary"
        [text]="true"
        (onClick)="toggleThemeCycle()"
        pTooltip="Alternar Tema"
        tooltipPosition="bottom"
      />

      @if (authService.currentUser()) {
        <div
          class="flex items-center gap-2 cursor-pointer"
          (click)="toggleMenu($event)"
        >
          <p-avatar
            [label]="userInitial()"
            shape="circle"
            class="border border-surface-200 dark:border-surface-700"
          />
        </div>
      }
    </div>
  </ng-template>
</p-menubar>

<p-menu #menu [model]="avatarItems()" [popup]="true" />
