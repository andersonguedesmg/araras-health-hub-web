<app-breadcrumb [itemsBreadcrumb]="itemsBreadcrumb()"></app-breadcrumb>

<div
  class="relative w-full h-[calc(100vh-7rem)] overflow-hidden transition-colors duration-200 bg-zinc-50 dark:bg-zinc-950 flex flex-col justify-between"
>
  <div
    class="absolute inset-0 pointer-events-none opacity-[0.04] dark:opacity-[0.07] bg-[linear-gradient(to_right,rgb(120,120,130)_1px,transparent_1px),linear-gradient(to_bottom,rgb(120,120,130)_1px,transparent_1px)] bg-[size:32px_32px]"
  ></div>

  <div
    class="relative max-w-7xl w-full mx-auto p-6 flex flex-col gap-6 overflow-y-auto flex-1"
  >
    <div
      class="w-full bg-white dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800/60 p-6 rounded-xl shadow-xs flex flex-col gap-1 z-10"
    >
      <span
        class="text-xs font-semibold text-zinc-400 dark:text-zinc-500 uppercase tracking-wider"
      >
        Erro de Navegação
      </span>
      <h1
        class="text-2xl md:text-3xl font-bold text-zinc-900 dark:text-zinc-50 tracking-tight"
      >
        Página Não Encontrada
      </h1>
    </div>

    <div
      class="w-full bg-white dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800/60 p-8 rounded-xl shadow-xs flex flex-col items-center justify-center text-center min-h-[360px] z-10"
    >
      <div
        class="text-6xl md:text-7xl font-black text-red-500 dark:text-red-400 tracking-tighter font-mono mb-6 animate-pulse"
      >
        404
      </div>

      <h3
        class="text-lg font-bold text-zinc-900 dark:text-zinc-50 tracking-tight mb-2"
      >
        Não conseguimos encontrar a página que você tentou acessar
      </h3>

      <p
        class="max-w-xl text-sm text-zinc-500 dark:text-zinc-400 font-medium leading-relaxed mb-8"
      >
        Isso pode acontecer se o link estiver desatualizado, se houve algum erro
        de digitação no endereço ou se a página mudou de lugar. Não se preocupe,
        todo o seu trabalho guardado continua seguro!
      </p>

      <p-button
        label="Voltar para a Página Inicial"
        icon="pi pi-arrow-left"
        severity="success"
        routerLink="/"
        styleClass="p-button-sm px-5 py-2 flex items-center justify-center rounded-lg shadow-xs transition-all duration-150 text-sm font-semibold"
      />
    </div>
  </div>
</div>
