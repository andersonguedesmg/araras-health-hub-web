<div
  class="flex h-screen bg-zinc-50 dark:bg-zinc-950 transition-colors duration-300 select-none overflow-hidden"
>
  <app-spinner [loading]="isLoading()"></app-spinner>

  <div
    class="w-full lg:w-1/2 flex items-center justify-center p-8 z-10 bg-white dark:bg-zinc-950 transition-colors duration-300 shadow-xl"
  >
    <div class="w-full max-w-sm flex flex-col gap-6">
      <div class="flex flex-col gap-1.5 text-left">
        <h2
          class="text-2xl font-bold text-zinc-900 dark:text-zinc-50 tracking-tight"
        >
          Acessar Plataforma
        </h2>
        <p class="text-xs font-medium text-zinc-500 dark:text-zinc-400">
          Insira suas credenciais para entrar.
        </p>
      </div>

      <form
        [formGroup]="loginForm"
        (ngSubmit)="login()"
        autocomplete="off"
        class="flex flex-col gap-4"
      >
        <div class="flex flex-col gap-1.5">
          <label
            for="username"
            class="text-xs font-bold text-zinc-700 dark:text-zinc-300 tracking-wide uppercase"
          >
            Usuário
          </label>
          <input
            type="text"
            id="username"
            formControlName="userName"
            pInputText
            class="w-full px-3.5 py-2.5 bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-lg text-sm text-zinc-900 dark:text-zinc-50 placeholder-zinc-400 dark:placeholder-zinc-500 focus:border-emerald-500 dark:focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 dark:focus:ring-emerald-500 transition-all outline-none disabled:opacity-50"
            placeholder="Usuário"
          />
          @if (
            loginForm.controls.userName.invalid &&
            loginForm.controls.userName.touched
          ) {
            <small class="text-xs text-red-500 font-medium">
              O nome de usuário é obrigatório.
            </small>
          }
        </div>

        <div class="flex flex-col gap-1.5">
          <label
            for="password"
            class="text-xs font-bold text-zinc-700 dark:text-zinc-300 tracking-wide uppercase"
          >
            Senha
          </label>
          <p-password
            id="password"
            formControlName="password"
            [feedback]="false"
            [toggleMask]="true"
            placeholder="••••••••"
            styleClass="w-full"
            [inputStyleClass]="
              'w-full px-3.5 py-2.5 bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-lg text-sm text-zinc-900 dark:text-zinc-50 placeholder-zinc-400 dark:placeholder-zinc-500 focus:border-emerald-500 dark:focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 dark:focus:ring-emerald-500 transition-all outline-none disabled:opacity-50'
            "
          />
          @if (
            loginForm.controls.password.invalid &&
            loginForm.controls.password.touched
          ) {
            <small class="text-xs text-red-500 font-medium">
              A senha é obrigatória.
            </small>
          }
        </div>

        <p-button
          type="submit"
          label="Entrar"
          icon="pi pi-sign-in"
          iconPos="right"
          severity="success"
          [loading]="isLoading()"
          [disabled]="loginForm.invalid || isLoading()"
          styleClass="w-full mt-3 p-button-sm bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white border-none py-3 flex items-center justify-center rounded-lg shadow-xs transition-all duration-150 text-sm font-semibold disabled:opacity-50 disabled:cursor-not-allowed"
        />
      </form>
    </div>
  </div>

  <div
    class="hidden lg:flex w-1/2 items-center justify-center bg-zinc-50 dark:bg-zinc-900 p-8 relative overflow-hidden transition-colors duration-300 border-l border-zinc-200/60 dark:border-zinc-800/50"
  >
    <div
      class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(16,185,129,0.08)_0%,transparent_65%)] dark:bg-[radial-gradient(circle_at_center,rgba(16,185,129,0.05)_0%,transparent_65%)]"
    ></div>

    <div
      class="absolute inset-0 opacity-[0.05] dark:opacity-[0.03] bg-[linear-gradient(to_right,rgb(24,24,27)_1px,transparent_1px),linear-gradient(to_bottom,rgb(24,24,27)_1px,transparent_1px)] dark:bg-[linear-gradient(to_right,rgb(161,161,170)_1px,transparent_1px),linear-gradient(to_bottom,rgb(161,161,170)_1px,transparent_1px)] bg-[size:24px_24px]"
    ></div>

    <img
      src="assets/a2h-logo.png"
      alt="Araras Health Hub Logo"
      class="max-w-xs relative z-10 object-contain drop-shadow-xl select-none"
    />
  </div>
</div>
